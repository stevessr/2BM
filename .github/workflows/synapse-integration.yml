name: Synapse integration smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synapse-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install SQLite build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - name: Compile bridge
        run: cargo build --bin two-bm
      - name: Exercise real Synapse and OneBot flow
        run: bash scripts/run_synapse_smoke.sh
