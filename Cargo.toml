[package]
name = "two-bm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Telegram, QQ/OneBot and Discord to Matrix application service"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
dotenvy = "0.15"
futures-util = "0.3"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = "0.10.0"
# grammers-crypto 0.10 relies on the prerelease rc0 glass_pumpkin API.
# rc1 changes both BigUint and safe_prime::check signatures.
glass_pumpkin = "=2.0.0-rc0"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "tls-rustls", "macros"] }
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4", "v5"] }
